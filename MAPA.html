const map=L.map("map").setView([-31.405,-64.185],12.2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const mk={};
H.forEach(h=>{

 const m=L.circleMarker([h.lat,h.lon],{radius:9,color:"#fff",weight:2,fillColor:c,fillOpacity:0.95}).addTo(map);
 m.bindPopup(`<b>#${h.r} ${h.id} ${h.b}</b><br>USD ${h.p}<br>${h.d} · ${h.m} m² · score ${h.s}<br><a href="${h.link}" target="_blank">aviso</a> · <a href="${h.comp}" target="_blank">comparable</a>`);
 mk[h.id]=m;
 const d=document.createElement("div"); d.className="card";
 d.innerHTML=`<b>#${h.r} ${h.id}</b> ${h.p/1000}k<br>${h.d} · ${h.b}`;
 d.onclick=()=>{map.setView([h.lat,h.lon],16);mk[h.id].openPopup();};
 document.getElementById("list").appendChild(d);
});
